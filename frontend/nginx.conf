server {
  listen 80;
  server_name localhost;
  root /usr/share/nginx/html;
  index index.html;

  location /education/app/ {
    alias /usr/share/nginx/html/;
    try_files $uri $uri/ /index.html;
  }

  location = /education/app {
    return 301 /education/app/;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
